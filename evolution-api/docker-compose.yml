version: '3.8'

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${SERVER_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY:-your_evolution_api_key_here}
      # Database Config
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${DATABASE_CONNECTION_URI:-postgresql://evo_user:evo_pass@evolution-postgres:5432/evolution?schema=public}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      # Redis Config
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/1
      - CACHE_LOCAL_ENABLED=false
      # Settings
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754
      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_COLOR=true
    depends_on:
      - evolution-postgres
      - evolution-redis
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-evo_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_production}
      - POSTGRES_DB=${POSTGRES_DB:-evolution}
    volumes:
      - evolution_db_data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: always
    volumes:
      - evolution_redis_data:/data

volumes:
  evolution_instances:
  evolution_store:
  evolution_db_data:
  evolution_redis_data:
